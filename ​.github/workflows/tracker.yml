# ============================================================
# 23. ANA PROGRAM
# ============================================================

async def main():

    if not TELEGRAM_TOKEN:

        raise RuntimeError(
            "TELEGRAM_TOKEN environment variable bulunamadı."
        )

    if not TELEGRAM_CHAT_ID:

        raise RuntimeError(
            "TELEGRAM_CHAT_ID environment variable bulunamadı."
        )

    print("")
    print(
        "=========================================="
    )
    print(
        " PARİS UÇUŞ ARAŞTIRMA V2"
    )
    print(
        "=========================================="
    )

    print(
        "Ana tarih:",
        MAIN_DEPARTURE,
        "→",
        MAIN_RETURN
    )

    print(
        "Gidiş alternatifleri:",
        DEPARTURE_DATES
    )

    print(
        "Dönüş alternatifleri:",
        RETURN_DATES
    )

    print("")

    # ========================================================
    # ARAŞTIR
    # ========================================================

    results = await research()

    print(
        f"Toplam ham sonuç: {len(results)}"
    )

    # ========================================================
    # TEMİZLE
    # ========================================================

    results = clean_results(
        results
    )

    print(
        f"Temizlenmiş sonuç: {len(results)}"
    )

    # ========================================================
    # GEÇMİŞ
    # ========================================================

    results = process_history(
        results
    )

    # ========================================================
    # KAYDET
    # ========================================================

    save_last_results(
        results
    )

    # ========================================================
    # RAPORLAR
    # ========================================================

    main_report = build_report(
        results
    )

    connection_report = build_connection_report(
        results
    )

    date_report = build_date_report(
        results
    )

    final_report = (
        main_report
        + connection_report
        + date_report
    )

    # ========================================================
    # TELEGRAM
    # ========================================================

    await send_telegram(
        final_report
    )

    print("")
    print(
        "✅ Telegram raporu gönderildi."
    )

    print(
        "=========================================="
    )


# ============================================================
# ÇALIŞTIR
# ============================================================

if __name__ == "__main__":

    asyncio.run(
        main()
    )
