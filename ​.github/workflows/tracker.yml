# 15. ANA ARAŞTIRMA
# ============================================================

async def research():

    all_results = []

    async with async_playwright() as p:

        browser = await p.chromium.launch(
            headless=True,
            args=[
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage"
            ]
        )

        context = await browser.new_context(

            viewport={
                "width": 1440,
                "height": 1000
            },

            locale="tr-TR",

            user_agent=(
                "Mozilla/5.0 "
                "(Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 "
                "(KHTML, like Gecko) "
                "Chrome/140.0.0.0 "
                "Safari/537.36"
            )
        )

        page = await context.new_page()

        # ====================================================
        # TARİHLER
        # ====================================================

        for departure in DEPARTURE_DATES:

            for return_date in RETURN_DATES:

                # =================================================
                # KALKIŞ ŞEHİRLERİ
                # =================================================

                for city, airports in ORIGINS.items():

                    for airport in airports:

                        # Paris havalimanlarının tamamını kontrol et
                        for paris_airport in DESTINATIONS:

                            print(
                                f"🔎 {airport} → "
                                f"{paris_airport} | "
                                f"{departure} → "
                                f"{return_date}"
                            )

                            url = google_flights_url(
                                airport,
                                paris_airport,
                                departure,
                                return_date
                            )

                            ok = await open_flights_page(
                                page,
                                url
                            )

                            if not ok:
                                continue

                            flights = await extract_google_results(
                                page,
                                airport,
                                paris_airport,
                                departure,
                                return_date
                            )

                            all_results.extend(
                                flights
                            )

                            # Google'a fazla hızlı yüklenme
                            await asyncio.sleep(2)

        # ====================================================
        # ANA TARİH İÇİN TURNA KONTROLÜ
        # ====================================================

        # Turna'yı bütün 60 kombinasyonda çalıştırmak yerine
        # ana tarihleri kontrol ediyoruz.
        #
        # Böylece günlük sistem çok daha hızlı çalışır.

        for city, airports in ORIGINS.items():

            for airport in airports:

                print(
                    f"🔵 Turna kontrolü: "
                    f"{airport}"
                )

                turna_result = await check_turna(
                    page,
                    airport,
                    "PAR",
                    MAIN_DEPARTURE,
                    MAIN_RETURN
                )

                if turna_result["price"]:

                    turna_result["airline"] = "Turna"

                    turna_result["stops"] = None

                    turna_result["duration"] = None

                    turna_result["transfer"] = None

                    turna_result["baggage"] = (
                        "Detay sayfasından kontrol"
                    )

                    all_results.append(
                        turna_result
                    )

        await browser.close()

    return all_results


# ============================================================
# 16. DUPLICATE TEMİZLE
# ============================================================

def clean_results(results):

    unique = {}

    for result in results:

        price = result.get("price")

        if not price:
            continue

        key = (
            result.get("source"),
            result.get("origin"),
            result.get("destination"),
            result.get("departure"),
            result.get("return"),
            result.get("airline"),
            price,
            result.get("stops"),
        )

        unique[key] = result

    results = list(
        unique.values()
    )

    return results


# ============================================================
# 17. FİYAT GEÇMİŞİNİ GÜNCELLE
# ============================================================

def process_history(results):

    for result in results:

        result["price_change"] = (
            update_history(result)
        )

    return results


