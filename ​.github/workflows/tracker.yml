                "🟢 Direkt uçuş"
            )

        elif stops is not None:

            lines.append(
                f"🔄 {stops} aktarma"
            )

        else:

            lines.append(
                "🔄 Aktarma bilgisi: "
                "belirlenemedi"
            )

        transfer = result.get(
            "transfer"
        )

        if transfer:

            lines.append(
                f"📍 Aktarma: {transfer}"
            )

        duration = result.get(
            "duration"
        )

        if duration:

            lines.append(
                f"⏱ Süre: "
                f"{format_duration(duration)}"
            )

        baggage = result.get(
            "baggage"
        )

        if baggage:

            lines.append(
                f"🧳 Bagaj: {baggage}"
            )

        # Fiyat geçmişi
        change = result.get(
            "price_change"
        )

        if change:

            if change["status"] == "new":

                lines.append(
                    "🆕 Fiyat geçmişi için ilk kayıt"
                )

            elif change["difference"] < 0:

                lines.append(
                    f"📉 *Fiyat düştü:* "
                    f"{money_text(abs(change['difference']))} "
                    f"(%{abs(change['percentage']):.1f})"
                )

            elif change["difference"] > 0:

                lines.append(
                    f"📈 *Fiyat arttı:* "
                    f"{money_text(change['difference'])} "
                    f"(%{change['percentage']:.1f})"
                )

            else:

                lines.append(
                    "➡️ Fiyat değişmedi."
                )

        lines.append(
            f"🔗 [Uçuşu görüntüle]"
            f"({result.get('search_url', result.get('url', ''))})"
        )

        lines.append(
            "━━━━━━━━━━━━━━━━━━━━"
        )

    # ========================================================
    # EN UCUZ
    # ========================================================

    cheapest = min(
        results,
        key=lambda x: x["price"]
    )

    lines.append("")

    lines.append(
        "🏆 *BUGÜNÜN EN UCUZ SEÇENEĞİ*"
    )

    lines.append(
        f"💰 {money_text(cheapest['price'])}"
    )

    lines.append(
        f"🛫 {cheapest['origin']} → "
        f"{cheapest['destination']}"
    )

    lines.append(
        f"🏷 {cheapest.get('airline', 'Bilinmiyor')}"
    )

    lines.append(
        f"📅 {cheapest['departure']} → "
        f"{cheapest['return']}"
    )

    # ========================================================
    # EN İYİ 3
    # ========================================================

    lines.append("")

    lines.append(
        "⭐ *ÇOCUKLARLA SEYAHAT İÇİN EN MANTIKLI 3 SEÇENEK*"
    )

    # Puanlama zaten fiyat + aktarma + süre
    # şeklinde yapılıyor.

    for i, result in enumerate(
        results[:3],
        1
    ):

        lines.append(
            f"{i}. "
            f"{money_text(result['price'])} — "
            f"{result['origin']} → "
            f"{result['destination']} — "
            f"{result.get('airline', 'Bilinmiyor')}"
        )

    return "\n".join(lines)


# ============================================================
# 19. AKTARMALI RAPOR
# ============================================================

def build_connection_report(results):

    connection_results = [
        x for x in results
        if x.get("stops") is not None
        and x.get("stops") > 0
    ]

    if not connection_results:

        return (
            "\n\n🔄 *AKTARMALI UÇUŞLAR*\n\n"
            "Bu çalıştırmada ayrıntılı aktarmalı "
            "uçuş bilgisi okunamadı.\n"
            "Debug kayıtları flight_data/debug "
            "klasöründe."
        )

    connection_results.sort(
        key=lambda x: x["price"]
    )

    lines = []

    lines.append("")
    lines.append("")
    lines.append(
        "🌍 *YURTDIŞI / AKTARMALI SEÇENEKLER*"
    )

    lines.append(
        "Özellikle ucuz aktarmalı seçenekler:"
    )

    lines.append("")

    for result in connection_results[:10]:

        lines.append(
            f"✈️ *{result['origin']} → "
            f"{result['destination']}*"
        )

        lines.append(
            f"💰 {money_text(result['price'])}"
        )

        lines.append(
            f"🏷 {result.get('airline', 'Bilinmiyor')}"
        )

        lines.append(
            f"🔄 {result['stops']} aktarma"
        )

        if result.get("transfer"):

            lines.append(
                f"📍 {result['transfer']}"
            )

        if result.get("duration"):

            lines.append(
                f"⏱ {format_duration(result['duration'])}"
            )

        lines.append(
            f"🔗 [Detay]({result['search_url']})"
        )

        lines.append("")

    return "\n".join(lines)


# ============================================================
# 20. TARİH KARŞILAŞTIRMA RAPORU
# ============================================================

def build_date_report(results):

    grouped = {}

    for result in results:

        key = (
            result["departure"],
            result["return"]
        )

        if key not in grouped:
            grouped[key] = []

        grouped[key].append(
            result
        )

    lines = []

    lines.append("")
    lines.append(
        "📅 *TARİH KARŞILAŞTIRMASI*"
    )

    lines.append("")

    date_best = []

    for dates, items in grouped.items():

        if not items:
            continue

        cheapest = min(
            items,
            key=lambda x: x["price"]
        )

        date_best.append(
            (
                cheapest["price"],
                dates,
                cheapest
            )
        )

    date_best.sort(
        key=lambda x: x[0]
    )

    for price, dates, result in date_best[:10]:

        departure, return_date = dates

        lines.append(
            f"📅 {departure} → {return_date}"
        )

        lines.append(
            f"💰 {money_text(price)}"
        )

        lines.append(
            f"🛫 {result['origin']}"
        )

        lines.append("")

    return "\n".join(lines)


# ============================================================
# 21. TELEGRAM GÖNDER
# ============================================================

async def send_telegram(text):

    bot = Bot(
        token=TELEGRAM_TOKEN
    )

    # Telegram maksimum mesaj uzunluğu
    # yaklaşık 4096 karakter.

    chunks = []

    while len(text) > 3900:

        cut = text.rfind(
            "\n",
            0,
            3900
        )

        if cut < 500:
            cut = 3900

        chunks.append(
            text[:cut]
        )

        text = text[cut:]

    if text:
        chunks.append(text)

    for chunk in chunks:

        await bot.send_message(
            chat_id=TELEGRAM_CHAT_ID,
            text=chunk,
            parse_mode="Markdown",
            disable_web_page_preview=True
        )

        await asyncio.sleep(1)


