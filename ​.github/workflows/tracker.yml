def now_string():
    return datetime.now().strftime("%Y-%m-%d %H:%M:%S")


def load_json(path, default):
    if not path.exists():
        return default

    try:
        with open(path, "r", encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return default


def save_json(path, data):
    with open(path, "w", encoding="utf-8") as f:
        json.dump(
            data,
            f,
            ensure_ascii=False,
            indent=2
        )


def money_text(price):
    if price is None:
        return "Bilinmiyor"

    return f"{price:,.0f} TL".replace(",", ".")


def parse_price(text):
    """
    Google Flights / Turna / farklı para gösterimlerini
    mümkün olduğunca TL sayısına dönüştürür.

    Not:
    Google Flights başka para biriminde açılırsa bunu
    TL olarak çevirmeye çalışmaz; currency filtresi
    aşağıda TRY olarak ayarlanmıştır.
    """

    if not text:
        return None

    text = text.strip()

    # TL / TRY / ₺
    if not any(x in text.upper() for x in ["TL", "TRY", "₺"]):
        return None

    # 12.345 TL
    m = re.search(
        r"(\d{1,3}(?:\.\d{3})+)\s*(?:TL|TRY|₺)",
        text,
        re.I
    )

    if m:
        try:
            return int(m.group(1).replace(".", ""))
        except:
            pass

    # 12345 TL
    m = re.search(
        r"(\d{4,7})\s*(?:TL|TRY|₺)",
        text,
        re.I
    )

    if m:
        try:
            return int(m.group(1))
        except:
            pass

    return None


def parse_duration(text):
    if not text:
        return None

    text = text.lower()

    hours = 0
    minutes = 0

    h = re.search(
        r"(\d+)\s*(?:sa|saat|h)",
        text
    )

    m = re.search(
        r"(\d+)\s*(?:dk|dakika|min|m)",
        text
    )

    if h:
        hours = int(h.group(1))

    if m:
        minutes = int(m.group(1))

    total = hours * 60 + minutes

    return total if total else None


def format_duration(minutes):
    if minutes is None:
        return "Bilinmiyor"

    hours = minutes // 60
    mins = minutes % 60

    if hours:
        return f"{hours}s {mins}dk"

    return f"{mins}dk"


def detect_stops(text):
    if not text:
        return None

    t = text.lower()

    if "nonstop" in t or "direct" in t or "direkt" in t:
        return 0

    patterns = [
        r"(\d+)\s*stop",
        r"(\d+)\s*aktarma",
    ]

    for pattern in patterns:
        m = re.search(pattern, t)

        if m:
            try:
                return int(m.group(1))
            except:
                pass

    if "1 stop" in t:
        return 1

    if "2 stops" in t:
        return 2

    if "2 aktarma" in t:
        return 2

    if "1 aktarma" in t:
        return 1

    return None


def detect_airline(text):
    if not text:
        return "Bilinmiyor"

    lower = text.lower()

    for airline in AIRLINES:

        if airline.lower() in lower:
            return airline

    return "Bilinmiyor"


def detect_transfer(text):
    if not text:
        return None

    lower = text.lower()

    found = []

    for city in TRANSFER_CITIES:

        if city.lower() in lower:
            if city not in found:
                found.append(city)

    if found:
        return ", ".join(found[:3])

    return None


def baggage_info(text):
    if not text:
        return "Bilinmiyor"

    t = text.lower()

    if "no checked bag" in t:
        return "Kayıtlı bagaj yok"

    if "checked bag" in t:
        return "Kayıtlı bagaj mevcut"

    if "bagaj dahil" in t:
        return "Bagaj dahil"

    if "bagajsız" in t:
        return "Bagajsız"

    kg = re.findall(
        r"(\d+)\s*kg",
        t
    )

    if kg:
        return f"{kg[0]} kg"

    return "Bilgi yok"


# ============================================================
# 7. GOOGLE FLIGHTS URL
# ============================================================

def google_flights_url(
    origin,
    destination,
    departure,
    return_date
):
    """
    Google Flights arama URL'si.

    q parametresi insan okunabilir bir uçuş sorgusu
    oluşturur.
    """

    query = (
        f"Flights from {origin} to {destination} "
        f"on {departure} through {return_date}"
    )

    return (
        "https://www.google.com/travel/flights?"
        f"q={quote(query)}"
        "&hl=tr"
        "&curr=TRY"
    )


# ============================================================
# 8. TURNА URL
# ============================================================

def turna_url(
    origin,
    destination,
    departure,
    return_date
):
    """
    Turna'nın rota URL'sini oluşturur.

    Turna URL yapısı zaman içinde değişebildiği için
    Google Flights bağlantısı ana güvenilir arama linkidir.
    """

    return (
        "https://www.turna.com/ucak-bileti/"
        f"{origin.lower()}-{destination.lower()}"
        f"?departureDate={departure}"
        f"&returnDate={return_date}"
    )


# ============================================================
# 9. GOOGLE FLIGHTS SAYFASINI AÇ
# ============================================================

async def open_flights_page(
    page,
    url
):
    try:

        await page.goto(
            url,
            wait_until="domcontentloaded",
            timeout=90000
        )

        # Google Flights dinamik sonuçları bekle
        await page.wait_for_timeout(7000)

        # Sayfayı aşağı kaydır
        for _ in range(5):

            await page.mouse.wheel(
                0,
                1200
            )

            await page.wait_for_timeout(700)

        return True

    except PlaywrightTimeoutError:

        print(
            "Google Flights timeout:",
            url
        )

        return False

    except Exception as e:

        print(
            "Google Flights hata:",
            e
        )

        return False


# ============================================================
# 10. GOOGLE FLIGHTS SONUÇLARINI OKU
# ============================================================

async def extract_google_results(
    page,
    origin,
    destination,
    departure,
    return_date
):

    results = []

    body_text = ""

    try:
        body_text = await page.locator(
            "body"
        ).inner_text()

    except Exception:
        return results

    # --------------------------------------------------------
    # DEBUG
    # --------------------------------------------------------

    debug_name = (
        f"{origin}_{destination}_"
        f"{departure}_{return_date}"
        .replace("/", "-")
    )

    try:

        with open(
            DEBUG_DIR / f"{debug_name}.txt",
            "w",
            encoding="utf-8"
        ) as f:

            f.write(body_text)

    except:
        pass

    # --------------------------------------------------------
    # SATIRLAR
    # --------------------------------------------------------

    lines = [
        line.strip()
        for line in body_text.splitlines()
        if line.strip()
    ]

    # --------------------------------------------------------
    # FİYAT SATIRLARINI BUL
    # --------------------------------------------------------

    price_positions = []

    for i, line in enumerate(lines):

        price = parse_price(line)

        if price:

            # Gerçek uçuş fiyatı olması muhtemel aralık
            if 1000 <= price <= 500000:

                price_positions.append(
                    (i, price)
                )

    # --------------------------------------------------------
    # FİYAT ETRAFINDAKİ BİLGİLERİ BİRLEŞTİR
    # --------------------------------------------------------

    for index, (position, price) in enumerate(
        price_positions
    ):

        start = max(
            0,
            position - 10
        )

        end = min(
            len(lines),
            position + 8
        )

        block = "\n".join(
            lines[start:end]
        )

        # Uçuşa ait olma ihtimalini artır
        if not any(
            x.lower() in block.lower()
            for x in AIRLINES
        ):

            # Havayolu görünmüyorsa da fiyatı atma
            pass

        airline = detect_airline(
            block
        )

        stops = detect_stops(
            block
        )

        transfer = detect_transfer(
            block
        )

        duration = None

        # Blok içindeki süreleri ara
        duration_matches = re.findall(
            r"(\d+\s*(?:sa|saat|h)"
            r"(?:\s*\d+\s*(?:dk|dakika|min|m))?)",
            block.lower()
        )

        if duration_matches:

            durations = [
                parse_duration(x)
                for x in duration_matches
            ]

            durations = [
                x for x in durations
                if x
            ]

            if durations:
                duration = max(durations)

        baggage = baggage_info(
            block
        )

        # ----------------------------------------------------
        # AYNI FİYATI TEKRAR ALMA
        # ----------------------------------------------------

        duplicate = False

        for old in results:

            if (
                old["price"] == price
                and old["airline"] == airline
                and old["stops"] == stops
            ):

                duplicate = True
                break

        if duplicate:
            continue

        result = {
            "source": "Google Flights",
            "origin": origin,
            "destination": destination,
            "departure": departure,
            "return": return_date,

            "price": price,

            "airline": airline,

            "stops": stops,

            "transfer": transfer,

            "duration": duration,

            "baggage": baggage,

            "search_url": google_flights_url(
                origin,
                destination,
                departure,
                return_date
            ),

            "raw": block[:1500],

            "checked_at": now_string()
        }

        results.append(result)

    # En ucuz ilk
    results.sort(
        key=lambda x: x["price"]
    )

    # Aynı aramadan çok fazla sonuç alma
    return results[:20]


# ============================================================
# 11. TURNА KONTROLÜ
# ============================================================

async def check_turna(
    page,
    origin,
    destination,
    departure,
    return_date
):

    url = turna_url(
        origin,
        destination,
        departure,
        return_date
    )

    result = {
        "source": "Turna",
        "origin": origin,
        "destination": destination,
        "departure": departure,
        "return": return_date,
        "price": None,
        "url": url,
        "checked_at": now_string()
    }

    try:

        await page.goto(
            url,
            wait_until="domcontentloaded",
            timeout=60000
        )

        await page.wait_for_timeout(
            7000
        )

        body = await page.locator(
            "body"
        ).inner_text()

        prices = []

        for line in body.splitlines():

            price = parse_price(
                line
            )

            if price and 1000 <= price <= 500000:

                prices.append(
                    price
                )

        if prices:

            result["price"] = min(
                prices
            )

    except Exception as e:

        print(
            "Turna hata:",
            origin,
            e
        )

    return result


# ============================================================
# 12. FİYAT GEÇMİŞİ
# ============================================================

def history_key(result):

    return "|".join([
        result["source"],
        result["origin"],
        result["destination"],
        result["departure"],
        result["return"],
        result.get("airline", ""),
        str(result.get("stops", ""))
    ])


def update_history(result):

    if result.get("price") is None:
        return None

    history = load_json(
        HISTORY_FILE,
        {}
    )

    key = history_key(
        result
    )

    today = datetime.now().strftime(
        "%Y-%m-%d"
    )

    if key not in history:

        history[key] = {
            "route": result["origin"],
            "destination": result["destination"],
            "airline": result.get("airline"),
            "prices": {}
        }

    prices = history[key]["prices"]

    previous_dates = [
        x for x in prices
        if x < today
    ]

    previous_price = None

    if previous_dates:

        previous_date = sorted(
            previous_dates
        )[-1]

        previous_price = prices[
            previous_date
        ]

    prices[today] = result["price"]

    save_json(
        HISTORY_FILE,
        history
    )

    if previous_price is None:
        return {
            "status": "new",
            "previous": None,
            "difference": None,
            "percentage": None
        }

    difference = (
        result["price"] -
        previous_price
    )

    percentage = (
        difference /
        previous_price
    ) * 100

    return {
        "status": "changed",
        "previous": previous_price,
        "difference": difference,
        "percentage": percentage
    }


# ============================================================
# 13. FİYAT DEĞİŞİM METNİ
# ============================================================

def price_change_text(change):

    if not change:
        return ""

    if change["status"] == "new":

        return "🆕 İlk kayıt"

    previous = change["previous"]
    difference = change["difference"]
    percentage = change["percentage"]

    if difference < 0:

        return (
            f"📉 Dün: {money_text(previous)}\n"
            f"🟢 Bugün: {money_text(previous + difference)}\n"
            f"⬇️ {money_text(abs(difference))} "
            f"(%{abs(percentage):.1f}) ucuzladı"
        )

    if difference > 0:

        return (
            f"📅 Önceki: {money_text(previous)}\n"
            f"🔴 Bugün: "
            f"{money_text(previous + difference)}\n"
            f"⬆️ {money_text(difference)} "
            f"(%{percentage:.1f}) arttı"
        )

    return (
        f"➡️ Fiyat değişmedi: "
        f"{money_text(previous)}"
    )


# ============================================================
# 14. SONUÇLARI PUANLA
# ============================================================

def score_flight(flight):

    price = flight.get("price") or 999999

    stops = flight.get("stops")

    duration = flight.get("duration")

    score = price

    # Aktarmaya ceza
    if stops == 1:
        score += 500

    elif stops == 2:
        score += 1000

    elif stops and stops >= 3:
        score += 2000

    # Çok uzun yolculuğa ceza
    if duration:

        if duration > 900:
            score += 2500

        elif duration > 720:
            score += 1500

        elif duration > 600:
            score += 750

    return score


