name: Paris Flight Tracker Automated

on:
  schedule:
    # TSİ ile Günde 4 Defa Çalışır:
    # 02:00 (Gece ucuz biletler)
    # 08:00 (Sabah kontrolü)
    # 14:00 (Öğlen kontrolü)
    # 20:00 (Akşam kontrolü)
    - cron: '0 23,5,11,17 * * *'
  workflow_dispatch: # İstediğiniz an elle çalıştırma butonu

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-telegram-bot
          playwright install chromium

      - name: Tarama Kodunu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
